<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Captcha! — Photobooth</title>
<!-- 포토부스 QR이 여는 사진 보기 페이지: 캡챠 로고 + 사진 + 저장 안내 (사진 파일은 임시 호스팅 주소 ?u=) -->
<style>
@font-face{font-family:'Space Grotesk';src:url('../fonts/SpaceGrotesk-Medium.ttf') format('truetype');font-weight:500}
@font-face{font-family:'ABC Galapagos';src:url('../fonts/ABCGalapagosCEdu-Bold.otf') format('opentype');font-weight:700}
:root{--blue:#5254FF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--blue);font-family:'Space Grotesk','Noto Sans KR',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(32px + env(safe-area-inset-bottom))}
.logo{width:min(320px,78vw);aspect-ratio:480.94/193.46;background:url('../logo-blue.svg') center/contain no-repeat}
.sub{font-family:'ABC Galapagos','Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;margin:6px 0 22px;text-align:center;line-height:1.5}
.photo{width:min(420px,100%);border:2px solid var(--blue);background:#EEEEFF;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;font-size:14px;font-weight:500;padding:0 16px}
.photo:has(img){padding:0}
/* 불러오는 동안: 사진과 같은 비율의 칸 안에 캡챠 격자(3×3) 로딩 */
.photo.loading{aspect-ratio:648/1152}
.ld{display:grid;grid-template-columns:repeat(3,22px);gap:6px}
.ld i{width:22px;height:22px;background:var(--blue);opacity:.15;animation:ld 1.2s infinite steps(1)}
.ld i:nth-child(1){animation-delay:0s}.ld i:nth-child(2){animation-delay:.1s}.ld i:nth-child(3){animation-delay:.2s}
.ld i:nth-child(6){animation-delay:.3s}.ld i:nth-child(9){animation-delay:.4s}.ld i:nth-child(8){animation-delay:.5s}
.ld i:nth-child(7){animation-delay:.6s}.ld i:nth-child(4){animation-delay:.7s}.ld i:nth-child(5){animation-delay:.8s}
@keyframes ld{0%{opacity:1}35%{opacity:.15}}
.photo img{display:block;width:100%;height:auto}
.hint{font-size:14px;font-weight:500;margin:18px 0 12px;text-align:center;word-break:keep-all}
.btn[hidden]{display:none}
.btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;background:var(--blue);color:#fff;text-decoration:none;font-weight:500;font-size:14px;padding:11px 20px}
.foot{margin-top:auto;padding-top:28px;font-size:11px;opacity:.7;text-align:center}
</style>
</head>
<body>
  <div class="logo" role="img" aria-label="Captcha!"></div>
  <div class="sub">SEOULTECH VISUAL COMMUNICATION DESIGN<br>THE 44TH GRADUATION EXHIBITION</div>
  <div class="photo loading" id="photo">
    <div class="ld" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span id="msg">사진을 불러오는 중이에요</span>
  </div>
  <div class="hint" id="hint">사진을 길게 눌러 저장하세요</div>
  <button class="btn" id="dl" type="button" hidden>사진 저장하기</button>
  <div class="foot">사진은 잠시 뒤 자동으로 삭제됩니다 · 2026 Captcha!</div>
<script>
(function(){
  var q = new URLSearchParams(location.search), id = q.get('id') || '';
  var u = q.get('u') || '';
  if (/^[\w-]{20,}$/.test(id)) u = 'https://lh3.googleusercontent.com/d/' + id + '=w2000'; // 위원회 드라이브 사진 (외부 페이지 이동 없이 바로 표시)
  var dl = document.getElementById('dl'), box = document.getElementById('photo'), msg = document.getElementById('msg');
  if (!/^https:\/\/(tmpfiles\.org|file\.io|lh3\.googleusercontent\.com)\//.test(u)) { box.classList.remove('loading'); box.querySelector('.ld').remove(); msg.textContent = '사진 주소가 올바르지 않아요'; document.getElementById('hint').style.display = 'none'; return; }
  // 외부 사이트(광고)로 넘어가지 않게: 사진을 직접 받아 올 수 있을 때만 저장 버튼을 보여 주고, 아니면 길게 눌러 저장만 안내
  var img = new Image();
  img.alt = 'Captcha! 포토부스 사진';
  img.onload = function(){ box.classList.remove('loading'); box.innerHTML = ''; box.appendChild(img); };
  img.onerror = function(){ // 임시 호스팅이 외부 표시를 막으면: 원본 페이지로 가는 버튼만 제공
    box.classList.remove('loading'); box.querySelector('.ld').remove();
    msg.textContent = '아래 버튼을 눌러 사진을 저장해 주세요';
    document.getElementById('hint').style.display = 'none';
    var go = document.createElement('a'); go.className = 'btn'; go.textContent = '사진 저장 페이지로 이동';
    go.href = u.replace('tmpfiles.org/dl/', 'tmpfiles.org/'); go.rel = 'noopener';
    dl.parentNode.insertBefore(go, dl);
    var note = document.createElement('div'); note.className = 'foot'; note.style.marginTop = '10px'; note.style.paddingTop = '0';
    note.textContent = '외부 파일 보관 사이트로 이동합니다. 광고가 보이면 닫고 사진을 길게 눌러 저장하세요';
    dl.parentNode.insertBefore(note, dl);
  };
  img.src = u;
  fetch(u).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(blob){
    if (!/^image\//.test(blob.type)) return; // 이미지가 아니면(광고·안내 페이지) 버튼 숨김 유지
    var file = new File([blob], 'captcha_photobooth.jpg', { type: blob.type || 'image/jpeg' });
    dl.hidden = false;
    dl.onclick = function(){
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function(){}); return; } // 휴대폰: 공유 시트 → 사진 저장
      var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    };
  }).catch(function(){});
})();
</script>
</body>
</html>
